name: Maven Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write

    env:
      MAVEN_OPTS: >-
        -Xms512m
        -Xmx4g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven build outputs
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: maven-build-cache-${{ runner.os }}-java-21-${{ github.sha }}
          restore-keys: |
            maven-build-cache-${{ runner.os }}-java-21-

      - name: Build with Maven
        run: mvn -B clean verify

      - name: Inspect JaCoCo reports
        if: always()
        run: |
          echo "===== JaCoCo Execution Data ====="

          find . -type f -name "jacoco.exec" -print

          echo "===== JaCoCo Execution Data Count ====="

          find . -type f -name "jacoco.exec" | wc -l

          echo "===== JaCoCo XML Reports ====="

          find . -type f \
            -path "*/target/site/jacoco/jacoco.xml" \
            -print

          echo "===== JaCoCo XML Report Count ====="

          find . -type f \
            -path "*/target/site/jacoco/jacoco.xml" \
            | wc -l

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Print application logs on failure
        if: failure()
        run: |
          echo "===== Order Management Application Logs ====="
          cat "$RUNNER_TEMP/order-management.log"

      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: order-management-application-logs
          path: ${{ runner.temp }}/order-management.log
