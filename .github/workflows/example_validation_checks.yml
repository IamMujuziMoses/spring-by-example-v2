name: Example Validation Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-readmes:
    name: Validate Repository and Example READMEs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check example READMEs
        shell: bash
        run: |
          set -euo pipefail

          failed=0

          validate_readme() {
            local readme="$1"

            if [[ ! -f "$readme" ]]; then
              echo "::error file=$readme::Missing README.md"
              echo "Missing README: $readme"
              failed=1
              return
            fi

            if [[ -z "$(tr -d '[:space:]' < "$readme")" ]]; then
              echo "::error file=$readme::README.md is empty"
              echo "Empty README: $readme"
              failed=1
            fi
          }

          # Validate the repository-level README.
          validate_readme "./README.md"

          # Find Maven projects that are not nested inside another Maven project.
          while IFS= read -r -d '' pom_file; do
            example_dir="$(dirname "$pom_file")"

            # Exclude the repository root.
            if [[ "$example_dir" == "." ]]; then
              continue
            fi

            parent_dir="$(dirname "$example_dir")"

            # Ignore nested Maven modules.
            if [[ -f "$parent_dir/pom.xml" ]]; then
              continue
            fi

            # Only validate directories containing Java source files.
            if ! find "$example_dir" \
                -type f \
                -name "*.java" \
                -not -path "*/target/*" \
                -print -quit | grep -q .; then
              continue
            fi

            validate_readme "$example_dir/README.md"

          done < <(
            find . \
              -type f \
              -name "pom.xml" \
              -not -path "./.git/*" \
              -not -path "*/target/*" \
              -print0
          )

          if [[ "$failed" -ne 0 ]]; then
            echo ""
            echo "README validation failed."
            exit 1
          fi

          echo "All examples have non-empty README.md files."

  validate-java-authors:
    name: Validate Java @author Javadocs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Java @author tags
        shell: bash
        run: |
          set -euo pipefail

          failed=0

          while IFS= read -r -d '' java_file; do
            if ! grep -Eq '^[[:space:]]*\*?[[:space:]]*@author([[:space:]]|$)' "$java_file"; then
              echo "::error file=$java_file::Missing @author Javadoc tag"
              echo "Missing @author: $java_file"
              failed=1
            fi
          done < <(
            find . \
              -type f \
              -name "*.java" \
              -not -path "./.git/*" \
              -not -path "*/target/*" \
              -print0
          )

          if [[ "$failed" -ne 0 ]]; then
            echo ""
            echo "Java @author validation failed."
            exit 1
          fi

          echo "All Java files contain an @author Javadoc tag."
