apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-native-config-reader
  namespace: cloud-native-configuration
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-native-config-reader-binding
  namespace: cloud-native-configuration
subjects:
  - kind: ServiceAccount
    name: cloud-native-config-client
    namespace: cloud-native-configuration
roleRef:
  kind: Role
  name: cloud-native-config-reader
  apiGroup: rbac.authorization.k8s.io
