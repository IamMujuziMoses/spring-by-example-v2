server:
  port: 8081

spring:
  application:
    name: dt-order-service

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  otlp:
    metrics:
      export:
        enabled: false

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
