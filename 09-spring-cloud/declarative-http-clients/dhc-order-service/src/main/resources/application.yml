server:
  port: 8081

spring:
  application:
    name: dhc-order-service

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always