server:
  port: 8081

spring:
  application:
    name: msg-order-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  cloud:
    stream:
      bindings:
        orderCreated-out-0:
          destination: orders.created
          content-type: application/json
