### `.gitlab-ci.yml`

stages:
  - build

variables:
  MAVEN_OPTS: >-
    -Xms512m
    -Xmx4g
    -Dmaven.repo.local=.m2/repository

cache:
  key: maven
  paths:
    - .m2/repository/

maven-build:
  stage: build
  tags:
    - local
  script:
    - java -version
    - mvn -version
    - mvn -T 1C verify
