### `.gitlab-ci.yml`

stages:
  - build

variables:
  MAVEN_OPTS: >-
    -Xms512m
    -Xmx4g
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository

cache:
  key: maven
  paths:
    - .m2/repository/
  policy: pull-push

maven-build:
  stage: build
  tags:
    - local
  script:
    - java -version
    - mvn -version

    # Build all examples except API Gateway, using Maven parallel execution and build cache.
    - >
      mvn -B clean verify
      -pl '!09-spring-cloud/api-gateway/ag-gateway-server,!09-spring-cloud/api-gateway/ag-order-service,!09-spring-cloud/api-gateway/ag-inventory-service,!09-spring-cloud/api-gateway/ag-integration-tests'
